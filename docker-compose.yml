services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jetstark
      POSTGRES_USER: jetstark
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetstark"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://jetstark:${DB_PASSWORD:-changeme}@db:5432/jetstark
      DATABASE_URL_SYNC: postgresql://jetstark:${DB_PASSWORD:-changeme}@db:5432/jetstark
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://jetstark.com,http://localhost
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot_data:/etc/letsencrypt
    depends_on:
      - api
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles:
      - prod
    volumes:
      - certbot_data:/etc/letsencrypt
      - ./frontend:/usr/share/nginx/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  certbot_data: