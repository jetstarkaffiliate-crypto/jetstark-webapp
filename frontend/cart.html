<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>Shopping Cart — Jetstark</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">Jetstark</a>
      <nav class="nav-links">
        <a href="/marketplace.html">Marketplace</a>
      </nav>
      <div class="auth-actions" id="header-auth">
        <a class="button button-secondary" href="/login.html">Sign in</a>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <div class="container">
      <h1>Shopping Cart</h1>
      <div id="cart-container"><p>Loading...</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><a class="logo footer-logo" href="/">Jetstark</a><p>Your cart, always in sync.</p></div>
      <div class="footer-links"><a href="/">Home</a><a href="/marketplace.html">Marketplace</a></div>
    </div>
    <div class="license-status"><p>&copy; 2026 Jetstark Inc.</p></div>
  </footer>

  <script type="module">
    import { cart, sanitizeHtml, getTokens, setTokens, clearTokens } from '/js/api.js';
    import { handleLogout, setupHeader } from '/js/auth.js';

    function requireAuth() {
      const t = getTokens();
      if (!t.access) { window.location.href = '/login.html'; return false; }
      return true;
    }

    async function renderCart() {
      const container = document.getElementById('cart-container');
      try {
        const data = await cart.get();
        if (!data.items?.length) {
          container.innerHTML = '<div class="empty-state"><p>Your cart is empty. <a href="/marketplace.html">Browse products.</a></p></div>';
          return;
        }
        container.innerHTML = data.items.map(item => `
          <div class="cart-item-row" data-id="${sanitizeHtml(item.id)}">
            <div class="cart-item-info">
              <div class="cart-item-name">${sanitizeHtml(item.product_name)}</div>
              <div class="cart-item-price">₦${Number(item.product_price).toLocaleString()} each</div>
            </div>
            <div class="cart-qty">
              <label>Qty:</label>
              <input type="number" min="1" value="${item.quantity}" class="qty-input" />
            </div>
            <div class="cart-item-subtotal">₦${(Number(item.product_price) * item.quantity).toLocaleString()}</div>
            <button class="cart-remove-btn" data-remove="${sanitizeHtml(item.id)}">Remove</button>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="cart-summary-card">
            <div class="cart-summary-row"><span>Items</span><span>${data.item_count}</span></div>
            <div class="cart-summary-row cart-summary-total"><span>Total</span><span>₦${Number(data.total).toLocaleString()}</span></div>
            <a href="/checkout.html" class="button button-primary checkout-btn-full">Proceed to Checkout</a>
          </div>
        `;

        container.querySelectorAll('.qty-input').forEach(input => {
          input.addEventListener('change', async (e) => {
            const row = e.target.closest('.cart-item-row');
            const id = row.dataset.id;
            const qty = parseInt(e.target.value) || 1;
            try { await cart.update(id, { quantity: qty }); renderCart(); }
            catch { renderCart(); }
          });
        });

        container.querySelectorAll('[data-remove]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.dataset.remove;
            try { await cart.remove(id); renderCart(); }
            catch { renderCart(); }
          });
        });
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>Error loading cart: ${sanitizeHtml(err.message)}</p></div>`;
      }
    }

    if (requireAuth()) {
      setupHeader();
      renderCart();
    }
  </script>
</body>
</html>
