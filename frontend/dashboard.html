<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>Redirecting — Jetstark</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .dashboard-router { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(0,255,136,0.2); border-top-color: #00ff88; border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem auto 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="dashboard-router">
    <div class="container loading-router-container">
      <h1>Loading Your Dashboard...</h1>
      <p id="loading-message">Redirecting you to your personalized dashboard.</p>
      <div class="spinner"></div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from '/js/auth.js';

    if (requireAuth()) {
      const userData = localStorage.getItem('jetstark_user');
      let role = 'buyer';
      try { role = JSON.parse(userData)?.role || 'buyer'; } catch {}

      const dashboardMap = {
        buyer: '/buyer-dashboard.html',
        affiliate: '/affiliate-dashboard.html',
        vendor: '/vendor-dashboard.html',
        admin: '/admin-dashboard.html',
      };

      const target = dashboardMap[role] || '/buyer-dashboard.html';
      const labels = { buyer: 'Buyer Dashboard', affiliate: 'Affiliate Dashboard', vendor: 'Vendor Dashboard', admin: 'Admin Dashboard' };
      document.getElementById('loading-message').textContent = `Taking you to your ${labels[role] || 'Dashboard'}.`;

      setTimeout(() => { window.location.href = target; }, 300);
    }
  </script>
</body>
</html>
