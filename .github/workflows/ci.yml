name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jetstark
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: jetstark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create .env
        working-directory: backend
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql+asyncpg://jetstark:changeme@localhost:5432/jetstark_test" > .env
          echo "SECRET_KEY=test-secret-key-not-for-production" >> .env
          echo "DEBUG=false" >> .env

      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -U jetstark -d jetstark_test && break
            sleep 2
          done

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://jetstark:changeme@localhost:5432/jetstark_test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        working-directory: backend
        run: ruff check app/ tests/
