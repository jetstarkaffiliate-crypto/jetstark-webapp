services:
  - type: web
    name: jetstark-api
    env: docker
    repo: https://github.com/jetstarkaffilliate-crypto/jetstark
    branch: main
    dockerfilePath: ./backend/Dockerfile.render
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jetstark-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: jetstark-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jetstark-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jetstark-api.onrender.com,https://jetstark.com
      - key: DEBUG
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@jetstark.com
      - key: SENTRY_DSN
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/uploads
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true

  - type: keyvalue
    name: jetstark-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: jetstark-db
    region: oregon
    plan: free
    postgresMajorVersion: 16
